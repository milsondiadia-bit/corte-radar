name: Corte Radar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corte-radar
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restaurar banco
        uses: actions/cache@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Restaurar modelo do Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet -r requirements.txt

      - name: Varrer perfis
        env:
          TWITTERAPI_IO_KEY:  ${{ secrets.TWITTERAPI_IO_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python -u -m radar.main --uma-vez 2>&1 | tee log.txt

      - name: Salvar log
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add -f log.txt
          git diff --staged --quiet && exit 0
          git commit -m "log $(date -u '+%Y-%m-%d %H:%M')"
          # Outro workflow pode ter gravado neste repositorio no mesmo minuto.
          # Sincroniza e tenta de novo antes de desistir.
          for tentativa in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push recusado (tentativa $tentativa) - sincronizando"
            git pull --rebase --autostash origin main || true
            sleep $((tentativa * 5))
          done
          echo "nao consegui salvar o log, mas o bot rodou normalmente"
          exit 0
